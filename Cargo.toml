[workspace]
members = ["crates/ofd-core", "crates/ofd-cli", "crates/ofd-app"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"
authors = ["VofdReader contributors"]

[workspace.dependencies]
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[patch.crates-io]
# GPUI Kit 0.9 wraps every Root in its own square client decoration.
gpui-component = { path = "vendor/gpui-component" }
