[package]
name = "ofd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command line inspector for OFD packages"

[dependencies]
ofd-core = { path = "../ofd-core" }
# Keep help, usage and diagnostic context; no terminal colors or fuzzy suggestions.
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
