[package]
name = "ofd-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Parser and rendering primitives for OFD (GB/T 33190-2016)"

[dev-dependencies]
tempfile.workspace = true

[dependencies]
roxmltree.workspace = true
thiserror.workspace = true
zip.workspace = true
# SVG is generated in memory, never read as gzip-compressed SVGZ. Keep text,
# system/embedded fonts and raster images; use resvg's matching usvg re-export.
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Embedded SFNT/CFF outlines, sparse CID mapping, cmaps and collection faces.
ttf-parser = "0.25"
# Raster decoders for the direct renderer; same versions resvg already uses.
zune-jpeg = "0.5"
gif = "0.14"
image-webp = "0.2"
