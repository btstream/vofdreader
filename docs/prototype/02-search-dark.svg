        <text x="245" y="74" font-size="9" fill="#6B7280" text-anchor="middle" letter-spacing="0.5">税总发〔2026〕18号</text>
        <path d="M45 86h400" stroke="#C8102E" stroke-width="2"/>

        <!-- 标题 -->
        <text x="245" y="116" font-size="17" font-weight="700" fill="#1A1D23" text-anchor="middle" letter-spacing="0.4">关于进一步优化增值税发票电子化服务</text>
        <text x="245" y="142" font-size="17" font-weight="700" fill="#1A1D23" text-anchor="middle" letter-spacing="0.4">有关事项的通知</text>

        <!-- 正文 -->
        <text x="45" y="174" font-size="10" fill="#23262D">各省、自治区、直辖市和计划单列市税务局：</text>

        <text x="64.6" y="198" font-size="9.8" fill="#2B3038">为深入贯彻落实《关于进一步深化税收征管改革的意见》，持续提升</text>
        <text x="45" y="216" font-size="9.8" fill="#2B3038">纳税人缴费人办税体验，现就优化增值税发票电子化服务有关事项</text>
        <text x="45" y="234" font-size="9.8" fill="#2B3038">通知如下。</text>

        <text x="45" y="262" font-size="10" font-weight="700" fill="#1F242C">一、持续拓展电子发票服务平台功能</text>
        <text x="64.6" y="281" font-size="9.8" fill="#2B3038">各地税务机关要进一步完善电子发票服务平台，支持纳税人通过网页端、</text>
        <text x="45" y="299" font-size="9.8" fill="#2B3038">移动端等渠道开具、查询和下载电子发票，持续提升服务稳定性和办理效率。</text>

        <text x="45" y="327" font-size="10" font-weight="700" fill="#1F242C">二、切实加强电子发票数据安全管理</text>
        <text x="64.6" y="346" font-size="9.8" fill="#2B3038">严格执行数据安全和个人信息保护相关要求，规范发票数据的采集、存储、</text>
        <text x="45" y="364" font-size="9.8" fill="#2B3038">使用和传输，切实保障纳税人合法权益。</text>

        <text x="45" y="392" font-size="10" font-weight="700" fill="#1F242C">三、认真做好宣传辅导和服务保障</text>
        <text x="64.6" y="411" font-size="9.8" fill="#2B3038">通过政策宣讲、操作培训等方式，帮助纳税人熟悉电子发票使用流程，及时</text>
        <text x="45" y="429" font-size="9.8" fill="#2B3038">回应纳税人关切，确保各项工作平稳有序推进。</text>

        <text x="45" y="457" font-size="10" font-weight="700" fill="#1F242C">四、持续跟踪政策实施效果</text>
        <text x="64.6" y="476" font-size="9.8" fill="#2B3038">各地税务机关要加强工作统筹，及时总结推广典型经验做法，重大问题及时</text>
        <text x="45" y="494" font-size="9.8" fill="#2B3038">报告税务总局。</text>

        <text x="445" y="566" font-size="10" fill="#2B3038" text-anchor="end">国家税务总局</text>
        <text x="445" y="584" font-size="10" fill="#2B3038" text-anchor="end">2026年10月28日</text>

