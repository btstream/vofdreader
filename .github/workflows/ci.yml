name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Keep in sync with the local development toolchain (rustc -vV).
  RUST_TOOLCHAIN: nightly-2026-05-29

jobs:
  test:
    name: test (archlinux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: System dependencies (GPUI)
        run: |
          pacman -Syu --noconfirm --needed \
            git rustup cmake pkgconf \
            alsa-lib fontconfig libx11 libxcb libxkbcommon libxkbcommon-x11 \
            openssl vulkan-icd-loader wayland zstd

      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc -vV

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Builds packaging/archlinux/PKGBUILD against the commit under test and
  # uploads the .pkg.tar.zst. A release build with thin LTO takes a while,
  # so this only runs for main and on manual dispatch, after tests pass.
  archlinux:
    name: Arch Linux package
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      # actions/checkout needs git in the container to keep .git, which
      # pkgver() and the git source both rely on; desktop-file-utils provides
      # the desktop-file-validate used below.
      - name: Install git
        run: pacman -Syu --noconfirm --needed git desktop-file-utils

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare build user and local source
        run: |
          useradd -m builder
          git config --system --add safe.directory '*'
          # The PKGBUILD clones GitHub main; point it at this checkout instead,
          # through a branch so the commit is reachable even from a detached checkout.
          git branch -f ci-package HEAD
          install -d -o builder /build
          sed "s|^source=.*|source=('vofdreader::git+file://$GITHUB_WORKSPACE#branch=ci-package')|" \
            packaging/archlinux/PKGBUILD > /build/PKGBUILD
          chown builder: /build/PKGBUILD
          grep '^source=' /build/PKGBUILD

      - name: Install build dependencies
        run: |
          cd /build
          mapfile -t deps < <(sudo -u builder makepkg --printsrcinfo \
            | sed -nE 's/^\s*(make)?depends = //p')
          pacman -S --noconfirm --needed "${deps[@]}"

      - uses: actions/cache@v4
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: archlinux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: archlinux-cargo-

      - name: Build package
        run: |
          install -d -o builder /home/builder/.cargo
          chown -R builder: /home/builder/.cargo
          cd /build
          # Workspace tests already ran in the test job; check() would repeat
          # them in release mode. Validate the desktop file here instead.
          desktop-file-validate "$GITHUB_WORKSPACE/packaging/linux/vofdreader.desktop"
          sudo -u builder makepkg --nocheck --noconfirm
          ls -l /build/*.pkg.tar.zst

      - name: Inspect package
        run: |
          pkg=$(ls /build/*.pkg.tar.zst | grep -v -- '-debug-')
          pacman -Qip "$pkg"
          pacman -Qlp "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: vofdreader-archlinux-x86_64
          path: /build/*.pkg.tar.zst
          if-no-files-found: error

  # Publishes the package as the rolling "nightly" pre-release of main: the
  # `nightly` tag moves to the built commit and the assets are replaced.
  # New assets are uploaded before stale ones are deleted, so the release
  # always has a downloadable package.
  nightly:
    name: Publish nightly release
    needs: archlinux
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vofdreader-archlinux-x86_64
          path: dist

      - name: Prepare assets
        run: |
          set -euo pipefail
          cd dist
          # Debug symbol packages stay in the workflow artifact only.
          rm -f -- *-debug-*.pkg.tar.zst
          ls *.pkg.tar.zst > /dev/null
          sha256sum -- *.pkg.tar.zst > SHA256SUMS
          ls -l

      - name: Move the nightly tag
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" > /dev/null
          fi

      - name: Publish release
        run: |
          set -euo pipefail
          pkg=$(ls dist/*.pkg.tar.zst | head -n 1)
          name=$(basename "$pkg")
          notes=$(cat <<NOTES
          Automatic build of \`main\` at ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d)).
          Untested pre-release; it is replaced by every push to main.

          Install on Arch Linux:

          \`\`\`sh
          curl -LO https://github.com/$GH_REPO/releases/download/nightly/$name
          curl -LO https://github.com/$GH_REPO/releases/download/nightly/SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          sudo pacman -U $name
          \`\`\`
          NOTES
          )
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly" --notes "$notes"
          else
            gh release create nightly --verify-tag --prerelease --title "Nightly" --notes "$notes"
          fi
          # A stream error while uploading can leave an incomplete "open"
          # asset behind. --clobber only removes completed assets, so a retry
          # then fails with "ReleaseAsset.name already exists" (HTTP 422).
          # Delete the conflicting name and back off before retrying.
          upload_asset() {
            local file=$1 name
            name=$(basename "$file")
            for attempt in 1 2 3 4 5; do
              if gh release upload nightly "$file" --clobber; then
                return 0
              fi
              echo "Upload of $name failed (attempt $attempt); deleting leftovers" >&2
              gh release delete-asset nightly "$name" -y > /dev/null 2>&1 || true
              sleep $((attempt * 5))
            done
            echo "Could not upload $name after 5 attempts" >&2
            return 1
          }
          # Upload one asset at a time so a failed file cannot leave its
          # siblings' uploads half-done.
          for file in dist/*; do
            upload_asset "$file"
          done
          # Drop packages of earlier commits (their names carry the version).
          keep=$(cd dist && ls)
          gh release view nightly --json assets -q '.assets[].name' | while read -r asset; do
            if ! grep -qxF -- "$asset" <<< "$keep"; then
              gh release delete-asset nightly "$asset" -y
            fi
          done
